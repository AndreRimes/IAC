# Adopt release "monitoring" without changing installed component versions.
grafana:
  image:
    tag: "12.4.0"
  admin:
    existingSecret: monitoring-grafana
  defaultDashboardsEnabled: false
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  deploymentStrategy:
    type: Recreate
  initChownData:
    securityContext:
      capabilities:
        drop: [ALL]
        # CHOWN alone cannot traverse Grafana's private png/pdf/csv directories.
        add: [CHOWN, DAC_READ_SEARCH]
  sidecar:
    image:
      registry: quay.io
      repository: kiwigrid/k8s-sidecar
      tag: "2.5.0"
    dashboards:
      label: infrastructure_dashboard
      labelValue: "1"
      searchNamespace: monitoring
  grafana.ini:
    server:
      domain: grafana.andrerimes.com
      root_url: https://grafana.andrerimes.com
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
    security:
      cookie_secure: true
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/infrastructure.json

prometheus:
  prometheusSpec:
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.9.1
    version: v3.9.1
    retention: 10d
    retentionSize: 15GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.31.1
    version: v0.31.1

prometheusOperator:
  image:
    tag: v0.89.0
  prometheusConfigReloader:
    image:
      tag: v0.89.0

kube-state-metrics:
  image:
    tag: v2.18.0

prometheus-node-exporter:
  image:
    tag: v1.10.2
