apiVersion: v1
kind: ServiceAccount
metadata:
  name: infrastructure-storage-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infrastructure-storage-collector
rules:
  - apiGroups: [""]
    resources: [persistentvolumes, namespaces]
    verbs: [list]
  - apiGroups: [""]
    resources: [nodes/proxy]
    resourceNames: [amdre]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infrastructure-storage-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infrastructure-storage-collector
subjects:
  - kind: ServiceAccount
    name: infrastructure-storage-collector
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-storage-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: infrastructure-storage-collector
  template:
    metadata:
      labels:
        app: infrastructure-storage-collector
    spec:
      serviceAccountName: infrastructure-storage-collector
      nodeSelector:
        kubernetes.io/hostname: amdre
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: python:3.13.12-slim-bookworm
          command: [python, -B, /app/collector.py]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9108
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [DAC_READ_SEARCH]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: pvcs
              mountPath: /data/pvcs
              readOnly: true
            - name: media
              mountPath: /data/media
              readOnly: true
            - name: legacy-media
              mountPath: /data/legacy-media
              readOnly: true
            - name: legacy-config
              mountPath: /data/legacy-config
              readOnly: true
            - name: legacy-cache
              mountPath: /data/legacy-cache
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: infrastructure-storage-collector
        - name: pvcs
          hostPath:
            path: /opt/local-path-provisioner
            type: Directory
        - name: media
          hostPath:
            path: /srv/media
            type: Directory
        - name: legacy-media
          hostPath:
            path: /mnt/media
            type: Directory
        - name: legacy-config
          hostPath:
            path: /mnt/jellyfin/config
            type: Directory
        - name: legacy-cache
          hostPath:
            path: /mnt/jellyfin/cache
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: infrastructure-storage-collector
  labels:
    app: infrastructure-storage-collector
spec:
  selector:
    app: infrastructure-storage-collector
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: infrastructure-storage-collector
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: infrastructure-storage-collector
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
