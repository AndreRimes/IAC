apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: Homelab workloads reconciled from github.com/AndreRimes/IAC

  sourceRepos:
    - https://github.com/AndreRimes/IAC.git
    - https://prometheus-community.github.io/helm-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: bidnow-namespace
    - server: https://kubernetes.default.svc
      namespace: onabudget-namespace
    - server: https://kubernetes.default.svc
      namespace: portfolio-namespace
    - server: https://kubernetes.default.svc
      namespace: sonarqube-namespace
    - server: https://kubernetes.default.svc
      namespace: media-namespace
    - server: https://kubernetes.default.svc
      namespace: registry-namespace
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: kube-system

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
