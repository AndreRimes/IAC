apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: bidnow
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: bidnow
      commonUpdateSettings:
        # newest-build ordering over CI commit tags -- see portfolio.yaml for why.
        updateStrategy: newest-build
        allowTags: "regexp:^main-[0-9a-f]{7}$"
      # All three bidnow images share one ImageUpdater because they share one
      # Application and one kustomization.yaml -- separate CRs would race each
      # other committing to the same file.
      images:
        - alias: front
          imageName: registry.andrerimes.com/andrerimes/bidnow-front
          manifestTargets:
            kustomize:
              name: registry.andrerimes.com/andrerimes/bidnow-front
        - alias: back
          imageName: registry.andrerimes.com/andrerimes/bidnow-back
          manifestTargets:
            kustomize:
              name: registry.andrerimes.com/andrerimes/bidnow-back
        - alias: recommendation
          imageName: registry.andrerimes.com/andrerimes/bidnow-recommendation
          manifestTargets:
            kustomize:
              name: registry.andrerimes.com/andrerimes/bidnow-recommendation
      writeBackConfig:
        method: git:secret:argocd/git-creds
        gitConfig:
          branch: main
          writeBackTarget: "kustomization:/kubernetes/apps/bidnow"
